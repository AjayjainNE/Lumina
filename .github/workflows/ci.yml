name: LUMINA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn matplotlib
          pip install fastapi httpx pytest pytest-asyncio
          pip install pydantic gymnasium stable-baselines3

      - name: Set environment variables
        run: |
          echo "MISTRAL_API_KEY=hdd30lQaVEcAv9WWugWTh1nOxoO1a3hH" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=http://localhost:5000" >> $GITHUB_ENV
          echo "PYTHONPATH=src" >> $GITHUB_ENV

      - name: Run tests
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -v --tb=short \
            -k "not TestAPI" \
            --ignore=tests/test_integration.py \
            2>&1 | head -100

      - name: Run quick smoke test
        run: |
          cd ${{ github.workspace }}/src
          python -c "
          import sys
          sys.path.insert(0, '.')
          from routing.cgr_algorithm import CGRRouter, STATE_DIM
          import numpy as np
          router = CGRRouter()
          emb = np.random.randn(STATE_DIM).astype('float32')
          d = router.route(emb)
          print(f'CGR smoke test: agents={d.selected_agents}, ensemble={d.ensemble}')
          print('PASS')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff
      - name: Lint with ruff
        run: ruff check src/ --select E,W,F --ignore E501 || true

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t lumina:latest .
          echo "Docker build successful ✓"
